app-id: com.housemd.markdown
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: housemd

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --filesystem=/tmp
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: housemd
    buildsystem: simple
    build-commands:
      - install -Dm755 housemd /app/bin/housemd
      - install -Dm755 pdflatex /app/bin/pdflatex
      - install -Dm755 xelatex /app/bin/xelatex
      - install -Dm755 lualatex /app/bin/lualatex
      - install -Dm644 com.housemd.markdown.desktop /app/share/applications/com.housemd.markdown.desktop
      - install -Dm644 com.housemd.markdown.metainfo.xml /app/share/metainfo/com.housemd.markdown.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/com.housemd.markdown/LICENSE
      - install -Dm644 icon-32.png /app/share/icons/hicolor/32x32/apps/com.housemd.markdown.png
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/com.housemd.markdown.png
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/com.housemd.markdown.png
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/com.housemd.markdown.png
    sources:
      - type: file
        path: ../src-tauri/target/release/housemd
      - type: file
        path: pdflatex
      - type: file
        path: xelatex
      - type: file
        path: lualatex
      - type: file
        path: com.housemd.markdown.desktop
      - type: file
        path: com.housemd.markdown.metainfo.xml
      - type: file
        path: ../LICENSE
      - type: file
        path: ../src-tauri/icons/32x32.png
        dest-filename: icon-32.png
      - type: file
        path: ../src-tauri/icons/128x128.png
        dest-filename: icon-128.png
      - type: file
        path: ../src-tauri/icons/128x128@2x.png
        dest-filename: icon-256.png
      - type: file
        path: icon-512.png
