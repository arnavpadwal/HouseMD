name: Bug report
description: Something rendered incorrectly, crashed, or behaved unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make HouseMD better. Please include enough detail to reproduce the issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the actual behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HouseMD version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Platform and environment
      placeholder: Arch Linux, KDE Wayland, WebKitGTK 2.48
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant terminal output, console errors, or drag in screenshots.
    validations:
      required: false
