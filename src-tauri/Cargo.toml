[package]
name = "housemd"
version = "1.0.0"
description = "A quiet, local-first Markdown editor built with Tauri"
license = "MIT"
repository = "https://github.com/arnavpadwal/HouseMD"
homepage = "https://github.com/arnavpadwal/HouseMD"
authors = ["Arnav Padwal"]
edition = "2021"

[lib]
name = "housemd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
